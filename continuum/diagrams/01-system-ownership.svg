<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Signal Amp MVP — responsibilities and ownership</title>
<desc>Three logical responsibility boundaries share one Windows desktop deployment and one maintainer. DesktopShell owns the volatile queue, Playback owns audio, and Catalog alone writes the durable Library. Two in-process notifications return to the shell.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 1 L 10 5 L 0 9 Z" fill="#24465F"/></marker>
<marker id="quiet" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#87919B"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="768" y="49" text-anchor="middle" font-size="34" font-weight="700" fill="#10253F">Signal Amp MVP — responsibilities and ownership</text>
<text x="768" y="84" text-anchor="middle" font-size="23" fill="#526277">One Windows desktop process; separate UI, audio and library responsibilities</text>

<g class="service" data-label="Desktop" data-grade="declared">
<rect x="370" y="115" width="700" height="145" rx="10" fill="#E6F2FF" stroke="#23558B" stroke-width="1.8"/>
<text x="720" y="149" text-anchor="middle" font-size="29" font-weight="700" fill="#123D68">Desktop</text>
<text x="720" y="176" text-anchor="middle" font-size="18" fill="#173D60">One desktop process</text>
<rect x="493" y="188" width="454" height="27" rx="6" fill="#CCE4FC"/>
<text x="720" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#153E68">WindowsDesktop: C# · .NET 10 · WPF</text>
<text x="720" y="241" text-anchor="middle" font-size="17" fill="#173D60">Keyboard-accessible shell; background import and playback work</text>
</g>
<g class="actor" data-label="DesktopMaintainer" data-grade="declared">
<rect x="1190" y="120" width="310" height="85" rx="9" fill="#F0F2F4" stroke="#7D8792" stroke-width="1.8"/>
<circle cx="1215" cy="144" r="7" fill="none" stroke="#536575" stroke-width="2"/>
<path d="M 1204 171 L 1204 164 Q 1215 150 1226 164 L 1226 171 M 1215 157 L 1215 180" fill="none" stroke="#536575" stroke-width="2"/>
<text x="1240" y="150" font-size="21" font-weight="700" fill="#18344F">DesktopMaintainer</text>
<text x="1240" y="180" font-size="16" fill="#42576B">Owns all three contexts</text>
</g>

<g class="domain" data-label="UserInterface" data-grade="declared">
<rect x="24" y="340" width="420" height="650" rx="10" fill="#EAF5FF" stroke="#238BEB" stroke-width="1.8"/>
<text x="44" y="376" font-size="28" font-weight="700" fill="#064B98">UserInterface</text>
<text x="44" y="402" font-size="18" fill="#224F75">Shell responsibility</text>
<g class="service" data-label="DesktopShell" data-grade="declared">
<rect x="44" y="430" width="380" height="290" rx="9" fill="#F8FCFF" stroke="#2793EE" stroke-width="1.6"/>
<text x="62" y="464" font-size="26" font-weight="700" fill="#084D9D">DesktopShell</text>
<text x="62" y="493" font-size="17" fill="#163D60"><tspan x="62">Owns the in-memory queue and</tspan><tspan x="62" dy="23">current entry</tspan></text>
<path d="M 62 530 L 406 530" stroke="#A9D0EF"/>
<text x="62" y="556" font-size="15" fill="#163D60"><tspan x="62">Player UI · staged import · playlist manager</tspan></text>
<text x="62" y="588" font-size="15" fill="#163D60"><tspan x="62">Advances queue once on normal completion</tspan></text>
<text x="62" y="620" font-size="15" fill="#163D60"><tspan x="62">Keeps failed imports for retry; reports</tspan><tspan x="62" dy="22">recoverable playback errors</tspan></text>
<rect x="62" y="666" width="165" height="28" rx="6" fill="#DBEDFF"/>
<text x="74" y="685" font-size="15" font-family="Consolas, monospace" fill="#175495">WPF code-behind</text>
</g>
</g>

<g class="domain" data-label="Transport" data-grade="declared">
<rect x="464" y="340" width="440" height="650" rx="10" fill="#E8F7F5" stroke="#00A698" stroke-width="1.8"/>
<text x="484" y="376" font-size="28" font-weight="700" fill="#00586B">Transport</text>
<text x="484" y="402" font-size="18" fill="#245866">Audio responsibility</text>
<g class="service" data-label="Playback" data-grade="declared">
<rect x="484" y="430" width="400" height="310" rx="9" fill="#F7FCFB" stroke="#12ABA5" stroke-width="1.6"/>
<text x="502" y="464" font-size="26" font-weight="700" fill="#005B6D">Playback</text>
<text x="502" y="493" font-size="17" fill="#174853"><tspan x="502">Owns decoding, audio output and</tspan><tspan x="502" dy="23">transport controls</tspan></text>
<path d="M 502 530 L 866 530" stroke="#A4D6D3"/>
<text x="502" y="555" font-size="15" fill="#174853"><tspan x="502">Position · pause/resume · seek · stop · volume</tspan></text>
<text x="502" y="586" font-size="15" fill="#174853"><tspan x="502">Analyzes samples before volume scaling;</tspan><tspan x="502" dy="22">discards superseded callbacks</tspan></text>
<text x="502" y="638" font-size="15" fill="#174853"><tspan x="502">Reports normal completion separately</tspan><tspan x="502" dy="22">from failure</tspan></text>
<text x="502" y="697" font-size="14" font-family="Consolas, monospace" fill="#08616B"><tspan x="502">NAudio 2.2.1: MediaFoundationReader ·</tspan><tspan x="502" dy="21">WASAPI shared mode</tspan></text>
</g>
<g class="service" data-label="PlaybackStateChanged" data-grade="declared">
<rect x="585" y="800" width="285" height="86" rx="8" fill="#D6F0ED" stroke="#0BA39A" stroke-width="1.5"/>
<text x="727" y="827" text-anchor="middle" font-size="20" font-weight="700" fill="#005B6D">PlaybackStateChanged</text>
<text x="727" y="851" text-anchor="middle" font-size="16" fill="#174853">Playback notification</text>
<text x="727" y="873" text-anchor="middle" font-size="14" fill="#174853">In-process notification</text>
</g>
</g>

<g class="domain" data-label="Collection" data-grade="declared">
<rect x="924" y="340" width="588" height="650" rx="10" fill="#FFF5DF" stroke="#D98A00" stroke-width="1.8"/>
<text x="944" y="376" font-size="28" font-weight="700" fill="#8A5000">Collection</text>
<text x="944" y="402" font-size="18" fill="#79501C">Library responsibility</text>
<g class="service" data-label="Catalog" data-grade="declared">
<rect x="944" y="430" width="548" height="280" rx="9" fill="#FFFBF2" stroke="#D38A13" stroke-width="1.6"/>
<text x="964" y="464" font-size="26" font-weight="700" fill="#8A5000">Catalog</text>
<text x="964" y="493" font-size="18" font-weight="600" fill="#79501C">Sole writer of Library</text>
<path d="M 964 507 L 1472 507" stroke="#EAC78C"/>
<text x="964" y="532" font-size="15" fill="#4E402B"><tspan x="964">Imports confirmed MP3s individually; leaves source audio</tspan><tspan x="964" dy="21">untouched</tspan></text>
<text x="964" y="581" font-size="15" fill="#4E402B"><tspan x="964">Ordered playlist entries allow repeated tracks; rename/replace</tspan><tspan x="964" dy="21">is transactional</tspan></text>
<text x="964" y="630" font-size="15" fill="#4E402B"><tspan x="964">Same path preserves identity; relinking preserves identity</tspan><tspan x="964" dy="21">and playlist positions</tspan></text>
<text x="964" y="689" font-size="14" font-family="Consolas, monospace" fill="#815000">TagLibSharp 2.3.0 · Microsoft.Data.Sqlite 10.0.14</text>
</g>
<g class="service" data-label="Library" data-grade="declared">
<rect x="944" y="765" width="548" height="130" rx="9" fill="#FFF9EB" stroke="#D38A13" stroke-width="1.8"/>
<text x="960" y="791" font-size="23" font-weight="700" fill="#8A5000">Library</text>
<text x="1055" y="790" font-size="16" fill="#635031">Durable records; strong consistency</text>
<text x="960" y="814" font-size="14" fill="#4E402B"><tspan x="960">File references · cached title, artist, duration · named playlists ·</tspan><tspan x="960" dy="18">ordered entries · catalog edit log</tspan></text>
<text x="960" y="853" font-family="Consolas, monospace" font-size="14" fill="#815000">SQLite: %LOCALAPPDATA%/MusicPlayer/library.sqlite3</text>
<text x="960" y="873" font-size="14" fill="#4E402B"><tspan x="960">Audio stays in listener-selected locations; active queue stays in memory</tspan></text>
</g>
<g class="service" data-label="ImportFinished" data-grade="declared">
<rect x="1220" y="914" width="272" height="62" rx="8" fill="#FFEBC0" stroke="#D38A13" stroke-width="1.5"/>
<text x="1356" y="936" text-anchor="middle" font-size="19" font-weight="700" fill="#8A5000">ImportFinished</text>
<text x="1234" y="956" font-size="14" fill="#634A25">Import notification</text>
<text x="1234" y="972" font-size="13" fill="#634A25">In-process notification</text>
</g>
</g>

<g fill="none" stroke="#87919B" stroke-width="1.4">
<g class="edge" data-from="DesktopMaintainer" data-to="UserInterface"><path d="M 1240 205 L 1240 285 L 200 285 L 200 340" marker-end="url(#quiet)"/><text x="218" y="311" fill="#63717E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">owns</text></g>
<g class="edge" data-from="DesktopMaintainer" data-to="Transport"><path d="M 1345 205 L 1345 308 L 700 308 L 700 340" marker-end="url(#quiet)"/><text x="717" y="331" fill="#63717E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">owns</text></g>
<g class="edge" data-from="DesktopMaintainer" data-to="Collection"><path d="M 1445 205 L 1445 340" marker-end="url(#quiet)"/><text x="1455" y="286" fill="#63717E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">owns</text></g>
<g class="edge" data-from="DesktopShell" data-to="Desktop"><path d="M 400 430 L 400 260" marker-end="url(#quiet)"/><text x="310" y="328" fill="#63717E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">deployed as</text></g>
<g class="edge" data-from="Playback" data-to="Desktop"><path d="M 850 430 L 850 260" marker-end="url(#quiet)"/><text x="860" y="328" fill="#63717E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">deployed as</text></g>
<g class="edge" data-from="Catalog" data-to="Desktop"><path d="M 1030 430 L 1030 260" marker-end="url(#quiet)"/><text x="1040" y="328" fill="#63717E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">deployed as</text></g>
</g>

<g fill="none" stroke="#24465F" stroke-width="1.8" stroke-linejoin="round">
<g class="edge" data-from="DesktopShell" data-to="Playback" data-kind="derived"><path d="M 424 475 L 484 475" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="451" y="552" text-anchor="middle" font-size="13" fill="#24465F" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" transform="rotate(-90 451 552)">calls with chosen track</text></g>
<g class="edge" data-from="Catalog" data-to="Library"><path d="M 1110 710 L 1110 765" marker-end="url(#arrow)" stroke-width="2.3"/><text x="990" y="743" font-size="15" fill="#79501C" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">reads + writes</text></g>
<g class="edge" data-from="Playback" data-to="PlaybackStateChanged"><path d="M 727 740 L 727 800" marker-end="url(#arrow)"/><text x="740" y="777" font-size="15" fill="#24465F" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">publishes</text></g>
<g class="edge" data-from="PlaybackStateChanged" data-to="DesktopShell"><path d="M 585 842 L 255 842 Q 245 842 245 832 L 245 720" marker-end="url(#arrow)"/><text x="350" y="832" font-size="15" fill="#24465F" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">received by</text></g>
<g class="edge" data-from="Catalog" data-to="ImportFinished"><path d="M 1492 650 L 1502 650 L 1502 904 L 1356 904 L 1356 914" marker-end="url(#arrow)"/><text x="1436" y="733" font-size="13" fill="#24465F" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">publishes</text></g>
<g class="edge" data-from="ImportFinished" data-to="DesktopShell"><path d="M 1220 945 L 920 945 L 920 905 L 120 905 Q 110 905 110 895 L 110 720" marker-end="url(#arrow)"/><text x="720" y="925" font-size="15" fill="#24465F" stroke="#FFFFFF" stroke-width="6" paint-order="stroke">received by</text></g>
</g>
<g class="legend" data-label="Arrows">
<text x="140" y="926" font-size="16" font-weight="700" fill="#20394E">Arrows</text>
<path d="M 140 945 L 189 945" fill="none" stroke="#24465F" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="201" y="950" font-size="13" fill="#344B60">Solid: stated in the model</text>
<path d="M 140 970 L 189 970" fill="none" stroke="#24465F" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="201" y="975" font-size="13" fill="#344B60">Dashed: follows from the model, not stated in it</text>
</g>
</svg>
