<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>Signal Amp: Playback and Windows audio</title>
<desc>Playback responsibilities and its WindowsDesktop audio technology binding, shown as distinct sections of one service. Analysis of decoded samples precedes volume scaling; spectrum analysis is qualified as inferred. No connectors are shown.</desc>
<defs></defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="768" y="85" text-anchor="middle" font-size="57" font-weight="750" letter-spacing="-1.8" fill="#0C2C50">Signal Amp: Playback and Windows audio</text>
<text x="768" y="145" text-anchor="middle" font-size="36" fill="#353B49">Service responsibilities and audio technology, kept distinct</text>
<g class="service" data-label="Playback" data-grade="declared">
<rect x="64" y="188" width="1408" height="792" rx="34" fill="#EDF5FA" stroke="#C5DCEC" stroke-width="4"/>
<circle cx="166" cy="268" r="50" fill="#194F80"/>
<path d="M 152 246 Q 150 245 150 249 L 150 287 Q 150 292 155 289 L 186 271 Q 191 268 186 265 L 155 246 Q 153 245 152 246 Z" fill="#FFFFFF"/>
<text x="252" y="275" font-size="64" font-weight="750" fill="#0C2C50">Playback</text>
<text x="256" y="321" font-size="33" fill="#444E5E"><tspan x="256" dy="0">Controls playback of shell-supplied track references</tspan></text>

<rect x="94" y="352" width="1350" height="359" rx="20" fill="#DCEEF9" stroke="#B8DEEF" stroke-width="2.5"/>
<g fill="#12385D" transform="translate(162 414)">
<path d="M -10 -35 L 10 -35 L 13 -25 L 21 -21 L 31 -24 L 38 -11 L 30 -4 L 30 5 L 38 12 L 30 25 L 20 22 L 12 27 L 9 36 L -10 36 L -13 26 L -21 21 L -31 24 L -38 11 L -30 4 L -30 -5 L -38 -12 L -30 -25 L -20 -22 L -13 -27 Z"/>
<circle cx="0" cy="0" r="15" fill="#DCEEF9"/>
</g>
<text x="232" y="421" font-size="41" font-weight="750" fill="#10365D">Signal Amp responsibilities</text>
<circle cx="243" cy="469" r="10" fill="#1265A5"/>
<text x="284" y="480" font-size="33" fill="#12385D">Position • pause • resume • seek • stop • volume</text>
<circle cx="243" cy="522" r="10" fill="#195585"/>
<text x="284" y="533" font-size="32" font-weight="700" fill="#10365D">Analyze decoded samples before volume scaling</text>
<text x="316" y="572" font-size="28" fill="#536A7D">Spectrum analysis — inferred</text>
<circle cx="243" cy="615" r="10" fill="#1265A5"/>
<text x="284" y="626" font-size="32" fill="#12385D">Discard superseded output callbacks</text>
<circle cx="243" cy="666" r="10" fill="#195585"/>
<text x="284" y="677" font-size="29" fill="#12385D">Report completion separately from failure; shell decides whether to advance</text>

<rect x="94" y="733" width="1350" height="218" rx="20" fill="#E0F4F3" stroke="#BDEBEC" stroke-width="2.5"/>
<text x="233" y="802" font-size="40" font-weight="750" fill="#0B5260">WindowsDesktop audio technology</text>
<text x="234" y="864" font-size="32" fill="#12384C"><tspan font-weight="700" fill="#0B5260">Decoder:</tspan><tspan xml:space="preserve"> NAudio 2.2.1 MediaFoundationReader</tspan></text>
<text x="234" y="916" font-size="32" fill="#12384C"><tspan font-weight="700" fill="#0B5260">Output:</tspan><tspan xml:space="preserve"> NAudio 2.2.1 WASAPI shared mode</tspan></text>
</g>
